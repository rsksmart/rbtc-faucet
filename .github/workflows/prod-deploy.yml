name: Build and Deploy to k8s (Production)

on:
  push:
    branches:
      - testnet
      - features/testnet-deploy
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}
  NAMESPACE: rbtcfaucet-production
  HELM_RELEASE: rbtcfaucet-production

jobs:
  build-and-push:
    permissions:
      id-token: write
      contents: read
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image-uri: ${{ steps.build-image.outputs.image }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.PRODUCTION_ROLE_ARN }}
        role-session-name: GitHubActions
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
        NEXT_PUBLIC_SITE_KEY_CAPTCHA: ${{ secrets.NEXT_PUBLIC_SITE_KEY_CAPTCHA }}
        NEXT_PUBLIC_TAG_MANAGER_ID: ${{ secrets.NEXT_PUBLIC_TAG_MANAGER_ID }}
      run: |
        BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')

        TAGS="-t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

        if [ "${{ github.ref }}" = "refs/heads/testnet" ]; then
          TAGS="$TAGS -t $ECR_REGISTRY/$ECR_REPOSITORY:latest"
        else
          TAGS="$TAGS -t $ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH_NAME"
        fi

        docker buildx build --platform linux/amd64 \
          --build-arg NEXT_PUBLIC_SITE_KEY_CAPTCHA="$NEXT_PUBLIC_SITE_KEY_CAPTCHA" \
          --build-arg NEXT_PUBLIC_TAG_MANAGER_ID="$NEXT_PUBLIC_TAG_MANAGER_ID" \
          --push $TAGS .

        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    permissions:
      id-token: write
      contents: read
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: prod

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a #v4.3.1
      with:
        role-to-assume: ${{ secrets.PRODUCTION_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Install Helm
      uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 #v4.3.1
      with:
        version: 'v3.14.0'

    - name: Update kubeconfig for EKS
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}
    
    - name: Debug - check caller identity                                                                                                                                                 
      run: |        
        aws sts get-caller-identity
        kubectl auth can-i get pods -n rbtcfaucet-production     

    - name: Generate environment values file
      env:
        RSK_NODE: ${{ secrets.RSK_NODE }}
        GOOGLE_CAPTCHA_URL: ${{ secrets.GOOGLE_CAPTCHA_URL }}
        NEXT_PUBLIC_SITE_KEY_CAPTCHA: ${{ secrets.NEXT_PUBLIC_SITE_KEY_CAPTCHA }}
        SECRET_VERIFY_CAPTCHA: ${{ secrets.SECRET_VERIFY_CAPTCHA }}
        NEXT_PUBLIC_TAG_MANAGER_ID: ${{ secrets.NEXT_PUBLIC_TAG_MANAGER_ID }}
        FAUCET_ADDRESS: ${{ secrets.FAUCET_ADDRESS }}
        FAUCET_PRIVATE_KEY: ${{ secrets.FAUCET_PRIVATE_KEY }}
        GAS_PRICE: ${{ secrets.GAS_PRICE }}
        GAS_LIMIT: ${{ secrets.GAS_LIMIT }}
        VALUE_TO_DISPENSE: ${{ secrets.VALUE_TO_DISPENSE }}
        PROMO_VALUE_TO_DISPENSE: ${{ secrets.PROMO_VALUE_TO_DISPENSE }}
        FILTER_BY_IP: ${{ secrets.FILTER_BY_IP }}
        TIMER_LIMIT: ${{ secrets.TIMER_LIMIT }}
        PROMO_CODE: ${{ secrets.PROMO_CODE }}
      run: |
        python3 -c "
        import json, os
        keys = [
          'RSK_NODE', 'GOOGLE_CAPTCHA_URL', 'NEXT_PUBLIC_SITE_KEY_CAPTCHA',
          'SECRET_VERIFY_CAPTCHA', 'NEXT_PUBLIC_TAG_MANAGER_ID', 'FAUCET_ADDRESS',
          'FAUCET_PRIVATE_KEY', 'GAS_PRICE', 'GAS_LIMIT', 'VALUE_TO_DISPENSE',
          'PROMO_VALUE_TO_DISPENSE', 'FILTER_BY_IP', 'TIMER_LIMIT', 'PROMO_CODE'
        ]
        missing = [k for k in keys if not os.environ.get(k)]
        if missing:
            raise SystemExit(f'Missing required environment variables for env-values.json: {\", \".join(missing)}')
        env = {k: os.environ[k] for k in keys}
        with open('/tmp/env-values.json', 'w') as f:
            json.dump({'env': env}, f)
        "

    - name: Deploy to EKS using Helm
      run: |
        helm upgrade --install ${{ env.HELM_RELEASE }} ./helm \
          --kubeconfig /home/runner/.kube/config \
          --namespace ${{ env.NAMESPACE }} \
          --values ./helm/values-production.yaml \
          -f /tmp/env-values.json \
          --set image.tag=${{ github.sha }} \
          --wait \
          --timeout 5m \
          --debug \
          --atomic

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/rbtcfaucet -n ${{ env.NAMESPACE }}
        kubectl get pods -n ${{ env.NAMESPACE }}
