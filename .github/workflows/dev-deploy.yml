name: Build and Deploy to k8s (Development)

on:
  pull_request:
    branches:
      - release/**
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

env:
  AWS_REGION: us-east-2
  IMAGE_TAG: ${{ github.sha }}
  NAMESPACE: rbtcfaucet-dev
  HELM_RELEASE: rbtcfaucet-dev

jobs:
  build-and-push:
    permissions:
      id-token: write
      contents: read
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      image-uri: ${{ steps.build-image.outputs.image }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 #v6.1.1
      with:
        role-to-assume: ${{ secrets.DEV_ROLE_ARN }}
        role-session-name: GitHubActions
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 #v2.1.5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd #v4.0.0

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
        NEXT_PUBLIC_SITE_KEY_CAPTCHA: ${{ secrets.NEXT_PUBLIC_SITE_KEY_CAPTCHA }}
        NEXT_PUBLIC_TAG_MANAGER_ID: ${{ secrets.NEXT_PUBLIC_TAG_MANAGER_ID }}
      run: |
        # Determine branch name for tagging
        BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')

        # Build tags array: always tag with the commit SHA
        TAGS="-t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

        # Tag as latest only for main; otherwise use a branch-based tag
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          TAGS="$TAGS -t $ECR_REGISTRY/$ECR_REPOSITORY:latest"
        else
          TAGS="$TAGS -t $ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH_NAME"
        fi

        # Build and push image with all tags using buildx
        docker buildx build --platform linux/amd64 \
          --build-arg NEXT_PUBLIC_SITE_KEY_CAPTCHA="$NEXT_PUBLIC_SITE_KEY_CAPTCHA" \
          --build-arg NEXT_PUBLIC_TAG_MANAGER_ID="$NEXT_PUBLIC_TAG_MANAGER_ID" \
          --push $TAGS .

        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    permissions:
      id-token: write
      contents: read
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev
    
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 #v6.1.1
      with:
        role-to-assume: ${{ secrets.DEV_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Install Helm
      uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 #v5.0.0
      with:
        version: 'v3.14.0'    

    - name: Update kubeconfig for EKS
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}
        echo $KUBECONFIG # Debug: Print kubeconfig path

    - name: Generate environment values file
      env:
        RSK_NODE: ${{ secrets.RSK_NODE }}
        GOOGLE_CAPTCHA_URL: ${{ secrets.GOOGLE_CAPTCHA_URL }}
        NEXT_PUBLIC_SITE_KEY_CAPTCHA: ${{ secrets.NEXT_PUBLIC_SITE_KEY_CAPTCHA }}
        SECRET_VERIFY_CAPTCHA: ${{ secrets.SECRET_VERIFY_CAPTCHA }}
        NEXT_PUBLIC_TAG_MANAGER_ID: ${{ secrets.NEXT_PUBLIC_TAG_MANAGER_ID }}
        FAUCET_ADDRESS: ${{ secrets.FAUCET_ADDRESS }}
        FAUCET_PRIVATE_KEY: ${{ secrets.FAUCET_PRIVATE_KEY }}
        GAS_PRICE: ${{ secrets.GAS_PRICE }}
        GAS_LIMIT: ${{ secrets.GAS_LIMIT }}
        VALUE_TO_DISPENSE: ${{ secrets.VALUE_TO_DISPENSE }}
        PROMO_VALUE_TO_DISPENSE: ${{ secrets.PROMO_VALUE_TO_DISPENSE }}
        FILTER_BY_IP: ${{ secrets.FILTER_BY_IP }}
        TIMER_LIMIT: ${{ secrets.TIMER_LIMIT }}
        PROMO_CODE: ${{ secrets.PROMO_CODE }}
      run: |
        python3 -c "
        import json, os
        keys = [
          'RSK_NODE', 'GOOGLE_CAPTCHA_URL', 'NEXT_PUBLIC_SITE_KEY_CAPTCHA',
          'SECRET_VERIFY_CAPTCHA', 'NEXT_PUBLIC_TAG_MANAGER_ID', 'FAUCET_ADDRESS',
          'FAUCET_PRIVATE_KEY', 'GAS_PRICE', 'GAS_LIMIT', 'VALUE_TO_DISPENSE',
          'PROMO_VALUE_TO_DISPENSE', 'FILTER_BY_IP', 'TIMER_LIMIT', 'PROMO_CODE'
        ]
        missing = [k for k in keys if not os.environ.get(k)]
        if missing:
            raise SystemExit(f'Missing required environment variables for env-values.json: {\", \".join(missing)}')
        env = {k: os.environ[k] for k in keys}
        with open('/tmp/env-values.json', 'w') as f:
            json.dump({'env': env}, f)
        "

    - name: Debug - verify env values are environment-specific
      run: |
        echo "GitHub environment: ${{ vars.GITHUB_ENVIRONMENT || 'dev' }}"
        echo "Workflow: ${{ github.workflow }}"
        echo "env-values.json hash:"
        sha256sum /tmp/env-values.json
        echo "Keys present:"
        python3 -c "
        import json, hashlib
        with open('/tmp/env-values.json') as f:
            data = json.load(f)
        for k, v in data['env'].items():
            h = hashlib.sha256(v.encode()).hexdigest()[:8]
            print(f'  {k}: len={len(v)}, hash_prefix={h}')
        "

    - name: Deploy to EKS using Helm
      run: |
        helm upgrade --install ${{ env.HELM_RELEASE }} ./helm \
          --kubeconfig /home/runner/.kube/config \
          --namespace ${{ env.NAMESPACE }} \
          --values ./helm/values-dev.yaml \
          -f /tmp/env-values.json \
          --set image.tag=${{ github.sha }} \
          --wait \
          --timeout 5m \
          --debug \
          --atomic

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/rbtcfaucet -n ${{ env.NAMESPACE }}
        kubectl get pods -n ${{ env.NAMESPACE }}