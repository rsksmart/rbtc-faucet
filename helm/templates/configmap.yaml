apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rbtc-faucet.fullname" . }}
  labels:
    {{- include "rbtc-faucet.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
