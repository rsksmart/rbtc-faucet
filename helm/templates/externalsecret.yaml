{{- if and .Values.externalSecrets .Values.externalSecrets.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rbtc-faucet.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rbtc-faucet.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: {{ include "rbtc-faucet.fullname" . }}-secrets
    creationPolicy: Owner
  data:
  - secretKey: ws-secret
    remoteRef:
      key: {{ .Values.externalSecrets.parameterPaths.wsSecret }}
{{- end }}
