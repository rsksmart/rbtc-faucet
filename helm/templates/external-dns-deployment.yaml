apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dns
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: "k8s.gcr.io/external-dns/external-dns:v0.13.6"
          args:
            - --source=service
            - --source=ingress
            - --domain-filter={{ .Values.externalDns.domainFilters | first }}
            - --provider=aws
            - --policy=upsert-only
            - --registry=txt
            - --txt-owner-id={{ .Values.externalDns.txtOwnerId }}
          env:
            - name: AWS_REGION
              value: {{ .Values.awsRegion | default "us-east-2" }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
