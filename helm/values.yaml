# Default values for rbtc-faucet (Production)
replicaCount: 2

image:
  repository: rbtc-faucet
  pullPolicy: IfNotPresent
  tag: "2.3.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: faucet.rsk.co
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: rbtc-faucet-tls
      hosts:
        - faucet.rsk.co

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application environment variables
env:
  # Node / RPC
  RSK_NODE: "https://public-node.rsk.co"

  # Captcha
  GOOGLE_CAPTCHA_URL: "https://www.google.com/recaptcha/api/siteverify"

  # Analytics
  NEXT_PUBLIC_TAG_MANAGER_ID: "NO_ID"

  # Gas & amounts
  GAS_PRICE: "60000000"
  GAS_LIMIT: "100000"
  VALUE_TO_DISPENSE: "0.000001"
  PROMO_VALUE_TO_DISPENSE: "0.00005"

  # App behavior
  FILTER_BY_IP: "true"
  TIMER_LIMIT: "180000"

  # Promo codes (JSON string)
  PROMO_CODE: '[{"code":"MAINNET","activationDate":"2025-01-01","expirationDate":"2025-12-31","maxDispensableRBTC":1}]'

# Secrets - these should be provided via sealed-secrets or external secrets operator
secrets:
  # SECRET_VERIFY_CAPTCHA: ""
  # NEXT_PUBLIC_SITE_KEY_CAPTCHA: ""
  # FAUCET_ADDRESS: ""
  # FAUCET_PRIVATE_KEY: ""
  existingSecret: "rbtc-faucet-secrets"

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
